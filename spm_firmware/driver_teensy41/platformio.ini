[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

lib_deps = 
    https://github.com/teemuatlut/TMCStepper                   ; tmc2209 uart
    https://github.com/gin66/FastAccelStepper                  ; step generation
    https://github.com/mjs513/Teensy-4.x-Quad-Encoder-Library  ; hardware quadrature
