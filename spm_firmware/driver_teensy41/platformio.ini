[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

build_flags = 
    -I include

lib_extra_dirs =
    lib

lib_deps = 
    https://github.com/teemuatlut/TMCStepper                   ; tmc2209 uart
    https://github.com/luni64/TeensyStep4                      ; teensystep4 motor driver
    https://github.com/mjs513/Teensy-4.x-Quad-Encoder-Library  ; hardware quadrature